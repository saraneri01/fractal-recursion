arch:
  name: hrm_fractal_c2@HierarchicalReasoningModel_ACTV1
  loss:
    name: components.hrm.losses@ACTLossHead
    loss_type: stablemax_cross_entropy
  H_cycles: 2
  H_layers: 4
  L_cycles: 2
  L_layers: 4
  N_inner: 2
  T_inner: 2
  expansion: 4
  halt_exploration_prob: 0.1
  halt_max_steps: 16
  hidden_size: 512
  num_heads: 8
  pos_encodings: rope
  puzzle_emb_ndim: 512
data_path: datasets/hrm/arc-aug-1000
global_batch_size: 48
epochs: 61
lr: 0.0001
lr_min_ratio: 1.0
lr_warmup_steps: 2000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
puzzle_emb_lr: 0.01
puzzle_emb_weight_decay: 0.1
project_name: fractal-recursion-hrm
run_name: fractal_c2_seed0
checkpoint_path: checkpoints/hrm/fractal_c2_seed0
seed: 0
checkpoint_every_eval: true
eval_interval: 61
eval_save_outputs: []
